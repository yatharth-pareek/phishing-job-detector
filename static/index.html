<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safe Check – Phishing & Fake Job Detector</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --ink:#2b2f3a; --muted:#6b7280; --line:#e5e7ef;
    --accent:#6c7bd9; --accent-dark:#5767c7;
    --low:#3f9d78; --low-bg:#e6f5ee; --mid:#c98a1b; --mid-bg:#fdf3dc; --high:#d0575f; --high-bg:#fbe9ea;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:680px;margin:0 auto;padding:40px 18px 60px}
  h1{font-size:1.7rem;margin:0 0 4px;text-align:center}
  .sub{text-align:center;color:var(--muted);margin:0 0 28px}
  .tabs{display:flex;gap:8px;background:#eceef6;padding:5px;border-radius:12px;margin-bottom:18px}
  .tab{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-size:.95rem;color:var(--muted);cursor:pointer}
  .tab.active{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(80,90,140,.06)}
  label{display:block;font-weight:600;margin-bottom:8px}
  input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fcfcfe;color:var(--ink)}
  textarea{min-height:170px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid #c9cffa;border-color:var(--accent)}
  .hint{font-size:.85rem;color:var(--muted);margin:6px 0 14px}
  .btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--accent-dark)} .btn:disabled{opacity:.6;cursor:wait}
  .result{margin-top:20px;border-radius:12px;padding:18px;display:none}
  .result.low{background:var(--low-bg)} .result.mid{background:var(--mid-bg)} .result.high{background:var(--high-bg)}
  .verdict{font-size:1.15rem;font-weight:700;margin-bottom:10px}
  .low .verdict{color:var(--low)} .mid .verdict{color:var(--mid)} .high .verdict{color:var(--high)}
  .bar{height:10px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden}
  .fill{height:100%;width:0;border-radius:99px;transition:width .6s ease}
  .low .fill{background:var(--low)} .mid .fill{background:var(--mid)} .high .fill{background:var(--high)}
  .meta{font-size:.9rem;color:var(--muted);margin:8px 0 12px}
  .result h3{font-size:.95rem;margin:0 0 6px}
  .result ul{margin:0;padding-left:20px} .result li{margin-bottom:4px}
  .err{color:var(--high);margin-top:12px;display:none}
  .foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:26px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛡️ Safe Check</h1>
  <p class="sub">Check suspicious websites and fake job posts</p>

  <div class="tabs">
    <button class="tab active" id="tab-url" onclick="show('url')">Website Check</button>
    <button class="tab" id="tab-job" onclick="show('job')">Job Check</button>
  </div>

  <div class="card">
    <div id="panel-url">
      <label for="urlInput">Website link</label>
      <input id="urlInput" type="text" placeholder="https://example.com/login">
      <p class="hint">Paste the full link (including https://).</p>
      <button class="btn" id="btn-url" onclick="check('url')">Check Website</button>
    </div>
    <div id="panel-job" class="hidden">
      <label for="jobInput">Job description</label>
      <textarea id="jobInput" placeholder="Paste the full job post here (title, description, contact details...)"></textarea>
      <p class="hint">The more text you paste, the better the result.</p>
      <button class="btn" id="btn-job" onclick="check('job')">Check Job Post</button>
    </div>

    <div class="err" id="err"></div>

    <div class="result" id="result">
      <div class="verdict" id="verdict"></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="meta" id="meta"></div>
      <h3>Risk indicators</h3>
      <ul id="indicators"></ul>
    </div>
  </div>

  <p class="foot">This is an ML-based estimate, not a 100% guarantee. Always verify before paying anyone.</p>
</div>

<script>
  function show(which){
    ['url','job'].forEach(function(k){
      document.getElementById('panel-'+k).classList.toggle('hidden', k!==which);
      document.getElementById('tab-'+k).classList.toggle('active', k===which);
    });
    document.getElementById('result').style.display='none';
    document.getElementById('err').style.display='none';
  }

  async function check(kind){
    var err=document.getElementById('err'), box=document.getElementById('result'), btn=document.getElementById('btn-'+kind);
    err.style.display='none'; box.style.display='none';
    var endpoint = kind==='url' ? '/predict-url' : '/predict-job';
    var body = kind==='url' ? {url: document.getElementById('urlInput').value}
                            : {text: document.getElementById('jobInput').value};
    btn.disabled=true; var old=btn.textContent; btn.textContent='Checking...';
    try{
      var res = await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      var data = await res.json();
      if(!res.ok){ throw new Error(data.detail || 'Something went wrong'); }
      render(kind, data);
    }catch(e){
      err.textContent = e.message; err.style.display='block';
    }finally{
      btn.disabled=false; btn.textContent=old;
    }
  }

  function render(kind, d){
    var cls = d.risk_level==='High' ? 'high' : d.risk_level==='Medium' ? 'mid' : 'low';
    var labels = {phishing:'⚠️ This may be a phishing site', safe:'✅ This looks safe',
                  fake:'⚠️ This may be a fake job', genuine:'✅ This looks genuine'};
    var box=document.getElementById('result');
    box.className='result '+cls; box.style.display='block';
    document.getElementById('verdict').textContent = labels[d.result];
    document.getElementById('meta').textContent = 'Risk score: '+d.risk_score+'/100  •  Risk level: '+d.risk_level;
    var fill=document.getElementById('fill'); fill.style.width='0';
    setTimeout(function(){ fill.style.width = d.risk_score+'%'; }, 50);
    var ul=document.getElementById('indicators'); ul.innerHTML='';
    var items = d.indicators.length ? d.indicators : ['No major red flags found'];
    items.forEach(function(t){ var li=document.createElement('li'); li.textContent=t; ul.appendChild(li); });
  }
</script>
</body>
</html>
